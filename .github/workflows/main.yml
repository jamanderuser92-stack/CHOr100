name: Build Windows VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build --config Release --target Chor100_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: Chor100-VST3-Windows
          path: build/Chor100_artefacts/Release/VST3
